<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つづくラボの道具箱</title>
<meta name="description" content="YouTubeチャンネル「つづくラボ」の動画で紹介した、続けるための道具。記録はすべて端末の中だけに保存されます。">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono&display=swap">
<style>
:root { --bg:#F3F6FA; --surface:#FFFFFF; --fg:#18263B; --muted:#5E6F87; --line:#D3DDEA; --ink:#2C5F9E; }
@media (prefers-color-scheme: dark) { :root { --bg:#0F1724; --surface:#172234; --fg:#E6EDF6; --muted:#9DAEC4; --line:#2B3B53; --ink:#7FB0EC; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; line-height:1.7; }
.wrap { max-width:560px; margin:0 auto; padding-inline:16px; padding-block:calc(28px + env(safe-area-inset-top, 0px)) 48px; display:flex; flex-direction:column; gap:20px; }
.brand { font-family:"DM Mono",monospace; font-size:12px; letter-spacing:.24em; color:var(--muted); }
h1 { font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:34px; line-height:1.2; margin:0; }
p { margin:0; }
.muted { color:var(--muted); }
a.tool { display:flex; flex-direction:column; gap:4px; padding:18px; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--fg); text-decoration:none; }
a.tool b { font-family:"Zen Kaku Gothic New",sans-serif; font-size:22px; color:var(--ink); }
a.tool:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
a.yt { align-self:flex-start; color:var(--ink); font-weight:700; text-underline-offset:3px; }
footer { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">TSUZUKU LAB</div>
  <h1>つづくラボの道具箱</h1>
  <p class="muted">動画で紹介した、続けるための道具です。どれも無料で、記録はあなたの端末の中にだけ保存されます。</p>
  <a class="tool" href="66days/">
    <b>66日チェック</b>
    <span>習慣が身につくまでの66日を、1日1タップで記録。数えるのは連続じゃなく合計。えらんだ相棒が一言かけてくれます。「2分だけはじめる」のタイマーも足せます。</span>
    <span class="muted">第1回「習慣は何日で身につく？」・第2回「2分だけはじめる」</span>
  </a>
  <a class="yt" href="https://www.youtube.com/@tsuzukulab" target="_blank" rel="noopener">YouTube「つづくラボ」で動画を見る →</a>
  <footer>つづくラボ｜研究でわかった、続く仕組み。</footer>
</div>
</body>
</html>
